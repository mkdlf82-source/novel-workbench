<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小说创作工作台 | 爆款短篇创作系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 移动端遮罩 -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ===== 侧边栏 ===== -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">✍️</span>
          <span class="logo-text">创作工作台</span>
        </div>
        <button class="sidebar-toggle" id="sidebar-close" title="收起菜单">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <!-- 由JS动态生成 -->
      </nav>
      <div class="sidebar-footer">
        <button class="btn-text" id="btn-export" title="导出全部数据">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>导出数据</span>
        </button>
        <label class="btn-text" title="导入数据">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>导入数据</span>
          <input type="file" id="btn-import" accept=".json" hidden>
        </label>
      </div>
    </aside>

    <!-- ===== 主区域 ===== -->
    <main id="main">
      <header id="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 id="page-title">工作台总览</h1>
          <span id="page-subtitle" class="page-subtitle"></span>
        </div>
        <div class="topbar-right">
          <div class="search-box">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="搜索...">
            <button id="search-clear" class="search-clear" style="display:none;">×</button>
          </div>
          <button class="btn-primary" id="btn-add">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>新建</span>
          </button>
        </div>
      </header>
      <div id="content">
        <!-- 由JS动态渲染 -->
      </div>
    </main>
  </div>

  <!-- ===== 模态框容器 ===== -->
  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">新建</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- 由JS动态生成表单 -->
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="modal-cancel">取消</button>
        <button class="btn-primary" id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 确认对话框 ===== -->
  <div id="confirm-overlay" class="modal-overlay" style="display:none;">
    <div class="modal modal-confirm">
      <div class="modal-header">
        <h2 id="confirm-title">确认</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message"></p>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="confirm-cancel">取消</button>
        <button class="btn-danger" id="confirm-ok">确认删除</button>
      </div>
    </div>
  </div>

  <!-- ===== Toast通知 ===== -->
  <div id="toast-container"></div>

  <script src="js/schemas.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
